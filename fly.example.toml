app = "ec-pubgm-result-maker"
primary_region = "iad"

[env]
  EC_DATA_DIR = "/data"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "ec_pubgm_data"
  destination = "/data"
